/* Without border-box, a 100%-wide select plus its padding and border is

  const state = Object.assign({}, D.state);
  let colourMode = 'worker';
  // ?lang=en and ?me=<username> let a link open in a chosen language, or straight
  // on one collector's zone - so each collector can be sent their own link.
  const params = new URLSearchParams(location.search);
  let lang = 'ar';
  try { lang = localStorage.getItem('bldy-lang') || 'ar'; } catch (e) { lang = 'ar'; }
  if (params.get('lang') === 'en' || params.get('lang') === 'ar') lang = params.get('lang');
  const initialMe = params.get('me') || '';
  const T = () => D.strings[lang];

  const map = L.map('map').setView([24.694, 46.76], 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'}).addTo(map);

  const outlines = L.geoJSON(D.neighborhoods, {
    style: {color: '#333', weight: 3, fill: false, dashArray: '8 5'}
  }).addTo(map);

  const esc = s => { const e = document.createElement('span'); e.textContent = s == null ? '' : s; return e.innerHTML; };
  const ltr = s => '<span class="ltr">' + esc(s) + '</span>';
  const zoneState = id => state[id] || {};

  // Coverage status. `activity` comes from the published sheet and says only
  // whether collection has started - never how much - so the client profile can
  // show real progress without a single POI count.
  function statusOf(zoneId) {
    const s = zoneState(zoneId);
    const raw = s.status || 'unassigned';
    if (raw === 'completed' || raw === 'blocked') return raw;
    if (s.activity && raw === 'assigned') return 'in_progress';
    return raw;
  }
  const statusLabel = key => T()['st_' + key] || key;

  function colourFor(props) {
    if (colourMode === 'worker') {
      const owner = zoneState(props.zone_id).assigned_username;
      return owner ? (D.workerColours[owner] || '#777') : '#c9c9c9';
    }
    return D.neighborhoodColours[props.neighborhood] || '#849CB1';
  }

  function styleFor(feature) {
    const props = feature.properties;
    const colour = colourFor(props);
    const status = statusOf(props.zone_id);
    return {
      color: colour,
      weight: status === 'completed' ? 3.5 : 2,
      fillColor: colour,
      fillOpacity: status === 'unassigned' ? 0.10 : ((props.order % 2) ? 0.30 : 0.45),
      dashArray: status === 'blocked' ? '5 4' : (status === 'in_progress' ? '9 4' : null)
    };
  }

  function popupHtml(props) {
    const s = zoneState(props.zone_id);
    const t = T();
    const streets = (props.boundary_streets || []).map(x => ltr(x)).join('، ') || esc(t.see_edge);
    let rows = `<span>${esc(t.collector)}</span><span>${s.assigned_username ? ltr(s.assigned_username) : esc(t.st_unassigned)}</span>`
             + `<span>${esc(t.status)}</span><span>${esc(statusLabel(statusOf(props.zone_id)))}</span>`
             + `<span>${esc(t.neighborhood)}</span><span>${ltr(props.neighborhood)}</span>`;
    if (D.showProgress) {
      rows += `<span>${esc(t.pois_submitted)}</span><span>${s.submitted ?? 0}</span>`
            + `<span>${esc(t.pending)}</span><span>${s.pending ?? 0}</span>`
            + `<span>${esc(t.accepted)}</span><span>${s.accepted ?? 0}</span>`
            + `<span>${esc(t.rejected)}</span><span>${s.rejected ?? 0}</span>`
            + `<span>${esc(t.last_activity)}</span><span>${s.last_activity ? ltr(s.last_activity) : '—'}</span>`;
    }
    let extra = '';
    if (D.showForeign && s.foreign_pois) {
      extra += `<p class="warn">${esc(t.foreign_warning)} ${s.foreign_pois}</p>`;
    }
    if (s.note) extra += `<p>${esc(s.note)}</p>`;
    return `<b>${ltr(props.zone_id)}</b><div class="pop-grid">${rows}</div>`
         + `<b>${esc(t.boundary_streets)}</b><br>${streets}${extra}`
         + `<br><small>${esc(t.click_point)}</small>`;
  }

  const layer = L.geoJSON(D.zones, {
    style: styleFor,
    onEachFeature: (feature, lyr) => {
      lyr.bindTooltip(feature.properties.zone_id, {direction: 'top'});
      lyr.on('click', event => {
        if (event.originalEvent) L.DomEvent.stopPropagation(event.originalEvent);
        lyr.bindPopup(popupHtml(feature.properties)).openPopup(event.latlng);
      });
    }
  }).addTo(map);

  let layersControl = null;
  function rebuildLayersControl() {
    if (layersControl) map.removeControl(layersControl);
    const overlays = {};
    overlays[T().layer_zones] = layer;
    overlays[T().layer_outlines] = outlines;
    const position = T().dir === 'rtl' ? 'topleft' : 'topright';
    layersControl = L.control.layers(null, overlays, {collapsed: false, position: position}).addTo(map);
  }

  function fitAll() {
    const wide = window.innerWidth > 640;
    const gutter = wide ? 345 : 20;
    const rtl = T().dir === 'rtl';
    map.fitBounds(outlines.getBounds(), {
      paddingTopLeft: [rtl ? 25 : gutter, 25],
      paddingBottomRight: [rtl ? gutter : 25, 25]
    });
  }

  let pin = null;
  map.on('click', event => {
    const lat = event.latlng.lat.toFixed(6), lon = event.latlng.lng.toFixed(6);
    if (pin) map.removeLayer(pin);
    const t = T();
    // Three routes, because one is never enough on Android. MIUI and similar skins
    // block the new tab, and an https maps link only reaches the app when Android
    // has verified the app link - which often it has not. The geo: URI hands the
    // coordinates to whatever maps app is installed, and copying always works.
    const web = `https://www.google.com/maps/dir/?api=1&destination=${lat}%2C${lon}&travelmode=driving`;
    const geo = `geo:${lat},${lon}?q=${lat},${lon}`;
    // Turn-by-turn from wherever the collector is standing. geo: only drops a
    // pin, and the https link lands in a browser tab on skins like MIUI.
    const drive = `google.navigation:q=${lat},${lon}&mode=d`;
    pin = L.marker(event.latlng).addTo(map).bindPopup(
      `<b>${esc(t.selected_point)}</b><br>${ltr(lat + ', ' + lon)}`
      + `<div class="navwrap">`
      + `<a class="navlink navmain" href="${drive}">${esc(t.navigate)}</a>`
      + `<a class="navlink" href="${web}" target="_blank" rel="noopener">${esc(t.nav_web)}</a>`
      + `<a class="navlink" href="${geo}">${esc(t.nav_app)}</a>`
      + `<button type="button" class="navlink navcopy" data-coords="${lat},${lon}">${esc(t.nav_copy)}</button>`
      + `</div><small>${esc(t.nav_hint)}</small>`).openPopup();
  });

  // Copy is the route that cannot be blocked by a browser or a missing app.
  document.addEventListener('click', event => {
    const button = event.target.closest && event.target.closest('button.navcopy');
    if (!button) return;
    const text = button.getAttribute('data-coords');
    const done = () => { button.textContent = T().nav_copied; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, done));
    } else {
      legacyCopy(text, done);
    }
  });

  function legacyCopy(text, done) {
    const field = document.createElement('textarea');
    field.value = text;
    field.setAttribute('readonly', '');
    field.style.position = 'fixed';
    field.style.opacity = '0';
    document.body.appendChild(field);
    field.select();
    try { document.execCommand('copy'); done(); } catch (error) { /* nothing else to try */ }
    document.body.removeChild(field);
  }

  const filters = {
    city: document.getElementById('f-city'),
    wave: document.getElementById('f-wave'),
    neighborhood: document.getElementById('f-neighborhood'),
    worker: document.getElementById('f-worker'),
    status: document.getElementById('f-status')
  };

  function fill(select, values, allLabel, labeller) {
    const previous = select.value;
    select.innerHTML = '';
    const all = document.createElement('option');
    all.value = ''; all.textContent = allLabel;
    select.appendChild(all);
    values.forEach(value => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = labeller ? labeller(value) : value;
      select.appendChild(option);
    });
    if (previous && values.includes(previous)) select.value = previous;
  }

  function refreshFilterOptions() {
    const t = T();
    const props = D.zones.features.map(f => f.properties);
    const uniq = list => [...new Set(list.filter(Boolean))].sort();
    const collectors = uniq(Object.values(state).map(s => s.assigned_username));
    fill(filters.city, uniq(props.map(p => p.city)), t.all_cities);
    fill(filters.wave, uniq(props.map(p => p.wave)), t.all_waves);
    fill(filters.neighborhood, uniq(props.map(p => p.neighborhood)), t.all_neighborhoods);
    fill(filters.worker, collectors, D.focusPicker ? t.pick_me : t.all_collectors);
    fill(filters.status, uniq(Object.keys(state).map(statusOf)), t.all_statuses, statusLabel);
  }

  function visible(props) {
    const s = zoneState(props.zone_id);
    return (!filters.city.value || props.city === filters.city.value)
        && (!filters.wave.value || props.wave === filters.wave.value)
        && (!filters.neighborhood.value || props.neighborhood === filters.neighborhood.value)
        && (!filters.worker.value || s.assigned_username === filters.worker.value)
        && (!filters.status.value || statusOf(props.zone_id) === filters.status.value);
  }

  function apply() {
    const t = T();
    let shown = 0, submitted = 0, accepted = 0;
    const byNeighborhood = {}, byWorker = {};

    layer.eachLayer(lyr => {
      const props = lyr.feature.properties;
      const s = zoneState(props.zone_id);
      const on = visible(props);
      const base = styleFor(lyr.feature);
      if (!on) {
        // Dim rather than hide: context is more useful than a blank map.
        lyr.setStyle({color: '#b9b9b9', fillColor: '#d5d5d5', opacity: 0.35, fillOpacity: 0.05, weight: 1});
        return;
      }
      shown++;
      // A single chosen collector gets extra weight so their zone reads instantly.
      lyr.setStyle(filters.worker.value
        ? Object.assign({}, base, {weight: 4, fillOpacity: 0.55, opacity: 1})
        : Object.assign({}, base, {opacity: 1}));
      byNeighborhood[props.neighborhood] = (byNeighborhood[props.neighborhood] || 0) + 1;
      if (s.assigned_username) byWorker[s.assigned_username] = (byWorker[s.assigned_username] || 0) + 1;
      submitted += s.submitted || 0; accepted += s.accepted || 0;
    });

    const total = D.zones.features.length;
    const assigned = Object.values(state).filter(s => s.assigned_username).length;
    let stats = `<div class="stat"><span>${esc(t.zones_shown)}</span><b>${shown} / ${total}</b></div>`
              + `<div class="stat"><span>${esc(t.assigned_count)}</span><b>${assigned}</b></div>`
              + `<div class="stat"><span>${esc(t.unassigned_count)}</span><b>${total - assigned}</b></div>`;
    if (D.showProgress) {
      stats += `<div class="stat"><span>${esc(t.pois_submitted)}</span><b>${submitted}</b></div>`
             + `<div class="stat"><span>${esc(t.accepted)}</span><b>${accepted}</b></div>`;
    }
    document.getElementById('stats').innerHTML = stats;

    const source = colourMode === 'worker' ? byWorker : byNeighborhood;
    const colours = colourMode === 'worker' ? D.workerColours : D.neighborhoodColours;
    document.getElementById('legend').innerHTML = Object.keys(source).sort().map(key =>
      `<li><span class="swatch" style="background:${colours[key] || '#777'}"></span>`
      + `${ltr(key)}: ${source[key]} ${esc(t.zones_word)}</li>`).join('')
      || `<li>${esc(t.no_match)}</li>`;
  }

  // Selecting a collector both filters and zooms. It used to be two controls -
  // a "my zone" picker and a collector filter - which keyed off the same field and
  // did almost the same thing.
  function onCollectorChange() {
    apply();
    const chosen = filters.worker.value;
    if (!chosen) { fitAll(); return; }
    const bounds = L.latLngBounds([]);
    layer.eachLayer(lyr => {
      if (zoneState(lyr.feature.properties.zone_id).assigned_username === chosen) bounds.extend(lyr.getBounds());
    });
    if (bounds.isValid()) map.fitBounds(bounds.pad(0.25));
  }

  function applyLanguage() {
    const t = T();
    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir;
    document.title = t['title_' + D.profile];
    document.getElementById('t-title').textContent = t['title_' + D.profile];
    document.getElementById('t-note').textContent = t['note_' + D.profile];
    document.getElementById('lang').textContent = t.toggle;
    document.getElementById('t-filter').textContent = t.filter;
    document.getElementById('grip').setAttribute('aria-label', t.filter);
    document.getElementById('t-colour').textContent = t.colour_by;
    document.getElementById('t-showing').textContent = t.showing;
    document.getElementById('l-city').textContent = t.city;
    document.getElementById('l-wave').textContent = t.wave;
    document.getElementById('l-neighborhood').textContent = t.neighborhood;
    document.getElementById('l-worker').textContent = D.focusPicker ? t.my_zone : t.collector;
    document.getElementById('l-status').textContent = t.zone_status;
    document.getElementById('mode-worker').textContent = t.by_collector;
    document.getElementById('mode-neighborhood').textContent = t.by_neighborhood;
    refreshFilterOptions();
    rebuildLayersControl();
    apply();
    setAsOf();
    fitAll();
  }

  let liveOk = false;
  function setAsOf() {
    const t = T();
    document.getElementById('asof').textContent = liveOk
      ? `${t.live} ${t.progress_as_of} ${D.asOf}`
      : `${t.snapshot} ${D.asOf}`;
  }
  const setBanner = html => { document.getElementById('banner').innerHTML = html; };

  Object.entries(filters).forEach(([name, select]) =>
    select.addEventListener('change', name === 'worker' ? onCollectorChange : apply));
  document.getElementById('mode-worker').addEventListener('click', () => setMode('worker'));
  document.getElementById('mode-neighborhood').addEventListener('click', () => setMode('neighborhood'));
  function setMode(mode) {
    colourMode = mode;
    document.getElementById('mode-worker').setAttribute('aria-pressed', String(mode === 'worker'));
    document.getElementById('mode-neighborhood').setAttribute('aria-pressed', String(mode === 'neighborhood'));
    apply();
  }
  document.getElementById('lang').addEventListener('click', () => {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('bldy-lang', lang); } catch (e) { /* private mode */ }
    applyLanguage();
  });
  const panel = document.getElementById('panel'), grip = document.getElementById('grip');
  function setPanel(open) {
    panel.classList.toggle('collapsed', !open);
    grip.setAttribute('aria-expanded', String(open));
    grip.textContent = open ? '▾' : '▴';
    grip.setAttribute('aria-label', T().filter);
  }
  grip.addEventListener('click', () => setPanel(panel.classList.contains('collapsed')));
  // Phones start collapsed so the map is visible; desktop is unchanged.
  setPanel(window.innerWidth > 640);

  function parseCsv(text) {
    const rows = []; let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
        else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function applyLive(text) {
    const rows = parseCsv(text);
    if (rows.length < 2) throw new Error('empty');
    const head = rows[0].map(h => h.trim());
    const at = name => head.indexOf(name);
    const idIndex = at('zone_id');
    if (idIndex < 0) throw new Error('no zone_id column');
    const num = v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };
    rows.slice(1).forEach(row => {
      const id = (row[idIndex] || '').trim();
      if (!id || !state[id]) return;
      const s = state[id];
      s.assigned_username = (row[at('assigned_username')] || '').trim();
      s.status = (row[at('status')] || '').trim() || 'unassigned';
      if (at('activity') >= 0) s.activity = (row[at('activity')] || '').trim().toLowerCase() === 'yes';
      if (at('note') >= 0) s.note = (row[at('note')] || '').trim();
      if (D.showProgress && at('submitted') >= 0) {
        s.submitted = num(row[at('submitted')]); s.pending = num(row[at('pending')]);
        s.accepted = num(row[at('accepted')]); s.rejected = num(row[at('rejected')]);
        s.last_activity = (row[at('last_activity')] || '').trim();
        s.foreign_pois = num(row[at('foreign_pois')]);
      }
    });
    liveOk = true;
    refreshFilterOptions();
    apply();
    setBanner('');
    setAsOf();
  }

  applyLanguage();
  if (initialMe) {
    filters.worker.value = initialMe;
    if (filters.worker.value === initialMe) onCollectorChange();
  }

  if (D.publishedCsvUrl) {
    setBanner(esc(T().loading));
    // Bound the wait: a request that neither resolves nor rejects would otherwise
    // leave the panel on "loading" forever while showing stale zones.
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    fetch(D.publishedCsvUrl, {cache: 'no-store', signal: controller.signal, redirect: 'follow'})
      .then(response => { if (!response.ok) throw new Error(response.status); return response.text(); })
      .then(text => { clearTimeout(timer); applyLive(text); })
      .catch(error => {
        clearTimeout(timer);
        const t = T();
        const why = (error && error.name === 'AbortError') ? t.timed_out : t.unreachable;
        setBanner(esc(why + ' ' + D.asOf + ' ' + t.may_be_stale));
      });
  } else {
    setBanner(esc(T().not_configured));
  }

  window.addEventListener('resize', () => { /* Leaflet handles redraw; panel is CSS-driven */ });
})();
</script>
</body>
</html>
