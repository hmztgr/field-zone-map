<style>
/* Without border-box, a 100%-wide select plus its padding and border is
   wider than the panel, which pushes the field labels off a phone screen. */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:"Segoe UI",Tahoma,Arial,Helvetica,sans-serif;color:#222}
#map{height:100%;width:100%}
.panel{position:absolute;z-index:1000;top:12px;inset-inline-start:54px;width:312px;max-height:calc(100% - 30px);
  overflow-x:hidden;overflow-y:auto;overflow-wrap:anywhere;background:#fff;padding:12px 14px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.22)}
.panel h1{font-size:16px;margin:0 0 4px;color:#5A3376}
.panel p.note{font-size:12px;margin:4px 0 10px;color:#555;line-height:1.6}
.panel h2{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#888;margin:12px 0 5px}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:7px}
.field label{font-size:11.5px;color:#666}
select{font:inherit;font-size:12.5px;padding:5px 6px;border:1px solid #d9d9d9;border-radius:5px;width:100%}
.modes{display:flex;gap:6px;margin:2px 0 4px}
.modes button{flex:1;font:inherit;font-size:11.5px;padding:5px 4px;border:1px solid #d9d9d9;background:#fff;
  border-radius:5px;cursor:pointer}
.modes button[aria-pressed=true]{background:#5A3376;color:#fff;border-color:#5A3376}
.counts{margin:6px 0 0;padding:0;list-style:none;font-size:12px}
.counts li{margin:4px 0;display:flex;gap:7px;align-items:center}
.swatch{width:12px;height:12px;display:inline-block;border-radius:2px;flex:none}
.stat{display:flex;justify-content:space-between;font-size:12px;margin:3px 0}
.stat b{font-weight:700}
.banner{background:#fdf3e7;border:1px solid #e8c9a0;color:#8a5a1a;font-size:11.5px;padding:6px 8px;
  border-radius:5px;margin-bottom:8px;line-height:1.6}
.banner:empty{display:none}
.asof{font-size:11px;color:#888;margin-top:10px;line-height:1.6}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
/* The language button lives inside the panel. Floating it over the map collided
   with Leaflet's zoom control, which sits top-left in both directions. */
.head{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.head h1{flex:1;min-width:0}
.langbtn{flex:none;background:#fff;border:1px solid #ccc;border-radius:6px;font:inherit;font-size:11.5px;
  padding:4px 10px;cursor:pointer;white-space:nowrap}
.langbtn:hover{border-color:#5A3376;color:#5A3376}
.leaflet-popup-content{line-height:1.6;font-size:12.5px}
.leaflet-popup-content b{color:#5A3376}
.pop-grid{display:grid;grid-template-columns:auto auto;gap:1px 10px;margin:5px 0}
.pop-grid span:nth-child(odd){color:#777}
.warn{color:#B23A2E;font-weight:700}
.amber{color:#C77A1E;font-weight:700}
.note-amber{color:#C77A1E}
.navwrap{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.navlink{display:inline-block;padding:7px 10px;font:inherit;font-size:12.5px;font-weight:700;
  color:#5A3376;background:#f6f2f9;border:1px solid #ddd3e6;border-radius:6px;text-decoration:none;
  cursor:pointer}
.navlink:active{background:#ece3f3}
.navmain{background:#5A3376;color:#fff;border-color:#5A3376;flex-basis:100%;text-align:center}
.navmain:active{background:#4a2a61}
.leaflet-popup-content small{color:#777;font-size:11px;line-height:1.5;display:block}
/* The grip only exists on phones, where the panel is a collapsible bottom sheet.
   Expanded by default it covered most of a phone screen, leaving no map. */
.grip{display:none}
@media(max-width:640px){
  .panel{inset-inline-start:8px;inset-inline-end:8px;width:auto;top:auto;bottom:8px;max-height:62%;
    padding:10px 12px;transition:max-height .18s ease}
  .panel h1{font-size:14px}
  .panel.collapsed{max-height:52px;overflow:hidden;padding-bottom:8px}
  .panel.collapsed #panelbody{display:none}
  .grip{display:inline-flex;align-items:center;justify-content:center;flex:none;width:34px;height:28px;
    background:#fff;border:1px solid #ccc;border-radius:6px;font:inherit;font-size:15px;line-height:1;
    cursor:pointer;color:#5A3376}
  .grip:active{background:#f3eef7}
}
</style>

</section>

  const filters = {
    city: document.getElementById('f-city'),
    wave: document.getElementById('f-wave'),
    neighborhood: document.getElementById('f-neighborhood'),
    worker: document.getElementById('f-worker'),
    status: document.getElementById('f-status')
  };

  function fill(select, values, allLabel, labeller) {
    const previous = select.value;
    select.innerHTML = '';
    const all = document.createElement('option');
    all.value = ''; all.textContent = allLabel;
    select.appendChild(all);
    values.forEach(value => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = labeller ? labeller(value) : value;
      select.appendChild(option);
    });
    if (previous && values.includes(previous)) select.value = previous;
  }

  function refreshFilterOptions() {
    const t = T();
    const props = D.zones.features.map(f => f.properties);
    const uniq = list => [...new Set(list.filter(Boolean))].sort();
    // Both columns feed the picker: a collector who only ever shares someone
    // else's ground would otherwise not be in the list, and could never find
    // their own area on the worker map.
    const collectors = uniq(Object.values(state).flatMap(s => [s.assigned_username, s.co_assigned_username]));
    fill(filters.city, uniq(props.map(p => p.city)), t.all_cities);
    fill(filters.wave, uniq(props.map(p => p.wave)), t.all_waves);
    fill(filters.neighborhood, uniq(props.map(p => p.neighborhood)), t.all_neighborhoods);
    fill(filters.worker, collectors, D.focusPicker ? t.pick_me : t.all_collectors);
    fill(filters.status, uniq(Object.keys(state).map(statusOf)), t.all_statuses, statusLabel);
  }

  // "Is this person entitled to work this zone" - the owner, or whoever the
  // coordinator put alongside them. Every place that used to compare against
  // assigned_username directly goes through here, so the two can never disagree
  // about whose zone it is.
  function worksHere(s, username) {
    return !!username && (s.assigned_username === username || s.co_assigned_username === username);
  }

  function visible(props) {
    const s = zoneState(props.zone_id);
    return (!filters.city.value || props.city === filters.city.value)
        && (!filters.wave.value || props.wave === filters.wave.value)
        && (!filters.neighborhood.value || props.neighborhood === filters.neighborhood.value)
        && (!filters.worker.value || worksHere(s, filters.worker.value))
        && (!filters.status.value || statusOf(props.zone_id) === filters.status.value);
  }

  function apply() {
    const t = T();
    let shown = 0, submitted = 0, accepted = 0;
    const byNeighborhood = {}, byWorker = {};

    layer.eachLayer(lyr => {
      const props = lyr.feature.properties;
      const s = zoneState(props.zone_id);
      const on = visible(props);
      const base = styleFor(lyr.feature);
      if (!on) {
        // Dim rather than hide: context is more useful than a blank map.
        lyr.setStyle({color: '#b9b9b9', fillColor: '#d5d5d5', opacity: 0.35, fillOpacity: 0.05, weight: 1});
        return;
      }
      shown++;
      // A single chosen collector gets extra weight so their zone reads instantly.
      lyr.setStyle(filters.worker.value
        ? Object.assign({}, base, {weight: 4, fillOpacity: 0.55, opacity: 1})
        : Object.assign({}, base, {opacity: 1}));
      byNeighborhood[props.neighborhood] = (byNeighborhood[props.neighborhood] || 0) + 1;
      if (s.assigned_username) byWorker[s.assigned_username] = (byWorker[s.assigned_username] || 0) + 1;
      submitted += s.submitted || 0; accepted += s.accepted || 0;
    });

    let pointsShown = 0, pointsOutside = 0, pointsOffscope = 0;
    if (markers.length) {
      const who = filters.worker.value;
      markers.forEach(entry => {
        const on = !who || entry.pt.u === who;
        if (on) { pointsShown++; if (entry.pt.o === 1) pointsOutside++; if (entry.pt.o === 2) pointsOffscope++; }
        if (on && !pointLayer.hasLayer(entry.marker)) pointLayer.addLayer(entry.marker);
        if (!on && pointLayer.hasLayer(entry.marker)) pointLayer.removeLayer(entry.marker);
      });
    }

    const total = D.zones.features.length;
    const assigned = Object.values(state).filter(s => s.assigned_username).length;
    let stats = `<div class="stat"><span>${esc(t.zones_shown)}</span><b>${shown} / ${total}</b></div>`
              + `<div class="stat"><span>${esc(t.assigned_count)}</span><b>${assigned}</b></div>`
              + `<div class="stat"><span>${esc(t.unassigned_count)}</span><b>${total - assigned}</b></div>`;
    if (D.showProgress) {
      stats += `<div class="stat"><span>${esc(t.pois_submitted)}</span><b>${submitted}</b></div>`
             + `<div class="stat"><span>${esc(t.accepted)}</span><b>${accepted}</b></div>`;
    }
    if (markers.length) {
      stats += `<div class="stat"><span>${esc(t.pt_shown)}</span><b>${pointsShown}</b></div>`;
      if (pointsOutside) {
        stats += `<div class="stat amber"><span>${esc(t.pt_outside)}</span><b>${pointsOutside}</b></div>`;
      }
      if (pointsOffscope) {
        stats += `<div class="stat warn"><span>${esc(t.pt_offscope)}</span><b>${pointsOffscope}</b></div>`;
      }
    }
    document.getElementById('stats').innerHTML = stats;

    const source = colourMode === 'worker' ? byWorker : byNeighborhood;
    const colours = colourMode === 'worker' ? D.workerColours : D.neighborhoodColours;
    document.getElementById('legend').innerHTML = Object.keys(source).sort().map(key =>
      `<li><span class="swatch" style="background:${colours[key] || '#777'}"></span>`
      + `${ltr(key)}: ${source[key]} ${esc(t.zones_word)}</li>`).join('')
      || `<li>${esc(t.no_match)}</li>`;
  }

  // Selecting a collector both filters and zooms. It used to be two controls -
  // a "my zone" picker and a collector filter - which keyed off the same field and
  // did almost the same thing.
  function onCollectorChange() {
    apply();
    const chosen = filters.worker.value;
    if (!chosen) { fitAll(); return; }
    const bounds = L.latLngBounds([]);
    layer.eachLayer(lyr => {
      if (worksHere(zoneState(lyr.feature.properties.zone_id), chosen)) bounds.extend(lyr.getBounds());
    });
    // Include their points, not just their zone. The whole reason to look at one
    // collector is to see whether their work sits inside the area they were given -
    // framing only the zone hides the answer off-screen.
    markers.forEach(entry => {
      if (entry.pt.u === chosen) bounds.extend(entry.marker.getLatLng());
    });
    if (bounds.isValid()) map.fitBounds(bounds.pad(0.15));
  }

  function applyLanguage() {
    const t = T();
    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir;
    document.title = t['title_' + D.profile];
    document.getElementById('t-title').textContent = t['title_' + D.profile];
    document.getElementById('t-note').textContent = t['note_' + D.profile];
    document.getElementById('lang').textContent = t.toggle;
    document.getElementById('t-filter').textContent = t.filter;
    document.getElementById('grip').setAttribute('aria-label', t.filter);
    document.getElementById('t-colour').textContent = t.colour_by;
    document.getElementById('t-showing').textContent = t.showing;
    document.getElementById('l-city').textContent = t.city;
    document.getElementById('l-wave').textContent = t.wave;
    document.getElementById('l-neighborhood').textContent = t.neighborhood;
    document.getElementById('l-worker').textContent = D.focusPicker ? t.my_zone : t.collector;
    document.getElementById('l-status').textContent = t.zone_status;
    document.getElementById('mode-worker').textContent = t.by_collector;
    document.getElementById('mode-neighborhood').textContent = t.by_neighborhood;
    refreshFilterOptions();
    rebuildLayersControl();
    apply();
    setAsOf();
    fitAll();
  }

  let liveOk = false;
  function setAsOf() {
    const t = T();
    document.getElementById('asof').textContent = liveOk
      ? `${t.live} ${t.progress_as_of} ${D.asOf}`
      : `${t.snapshot} ${D.asOf}`;
  }
  const setBanner = html => { document.getElementById('banner').innerHTML = html; };

  Object.entries(filters).forEach(([name, select]) =>
    select.addEventListener('change', name === 'worker' ? onCollectorChange : apply));
  document.getElementById('mode-worker').addEventListener('click', () => setMode('worker'));
  document.getElementById('mode-neighborhood').addEventListener('click', () => setMode('neighborhood'));
  function setMode(mode) {
    colourMode = mode;
    document.getElementById('mode-worker').setAttribute('aria-pressed', String(mode === 'worker'));
    document.getElementById('mode-neighborhood').setAttribute('aria-pressed', String(mode === 'neighborhood'));
    apply();
  }
  document.getElementById('lang').addEventListener('click', () => {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('bldy-lang', lang); } catch (e) { /* private mode */ }
    applyLanguage();
  });
  const panel = document.getElementById('panel'), grip = document.getElementById('grip');
  function setPanel(open) {
    panel.classList.toggle('collapsed', !open);
    grip.setAttribute('aria-expanded', String(open));
    grip.textContent = open ? '▾' : '▴';
    grip.setAttribute('aria-label', T().filter);
  }
  grip.addEventListener('click', () => setPanel(panel.classList.contains('collapsed')));
  // Phones start collapsed so the map is visible; desktop is unchanged.
  setPanel(window.innerWidth > 640);

  function parseCsv(text) {
    const rows = []; let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
        else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function applyLive(text) {
    const rows = parseCsv(text);
    if (rows.length < 2) throw new Error('empty');
    const head = rows[0].map(h => h.trim());
    const at = name => head.indexOf(name);
    const idIndex = at('zone_id');
    if (idIndex < 0) throw new Error('no zone_id column');
    const num = v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };
    rows.slice(1).forEach(row => {
      const id = (row[idIndex] || '').trim();
      if (!id || !state[id]) return;
      const s = state[id];
      s.assigned_username = (row[at('assigned_username')] || '').trim();
      // Guarded: the published CSV may still be a tab that predates this column,
      // and reading row[-1] would silently assign the last cell as a collector.
      if (at('co_assigned_username') >= 0) s.co_assigned_username = (row[at('co_assigned_username')] || '').trim();
      s.status = (row[at('status')] || '').trim() || 'unassigned';
      if (at('activity') >= 0) s.activity = (row[at('activity')] || '').trim().toLowerCase() === 'yes';
      if (at('note') >= 0) s.note = (row[at('note')] || '').trim();
      if (D.showProgress && at('submitted') >= 0) {
        s.submitted = num(row[at('submitted')]); s.pending = num(row[at('pending')]);
        s.accepted = num(row[at('accepted')]); s.rejected = num(row[at('rejected')]);
        s.last_activity = (row[at('last_activity')] || '').trim();
        s.foreign_pois = num(row[at('foreign_pois')]);
      }
    });
    liveOk = true;
    refreshFilterOptions();
    apply();
    setBanner('');
    setAsOf();
  }

  applyLanguage();
  if (initialMe) {
    filters.worker.value = initialMe;
    if (filters.worker.value === initialMe) onCollectorChange();
  }

  if (D.publishedCsvUrl) {
    setBanner(esc(T().loading));
    // Bound the wait: a request that neither resolves nor rejects would otherwise
    // leave the panel on "loading" forever while showing stale zones.
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    fetch(D.publishedCsvUrl, {cache: 'no-store', signal: controller.signal, redirect: 'follow'})
      .then(response => { if (!response.ok) throw new Error(response.status); return response.text(); })
      .then(text => { clearTimeout(timer); applyLive(text); })
      .catch(error => {
        clearTimeout(timer);
        const t = T();
        const why = (error && error.name === 'AbortError') ? t.timed_out : t.unreachable;
        setBanner(esc(why + ' ' + D.asOf + ' ' + t.may_be_stale));
      });
  } else {
    setBanner(esc(T().not_configured));
  }

  window.addEventListener('resize', () => { /* Leaflet handles redraw; panel is CSS-driven */ });
})();
</script>
</body>
</html>
